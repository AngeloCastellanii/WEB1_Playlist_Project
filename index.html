<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayList (Proyecto)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pl-app" id="playlistApp">
    
    <!-- HEADER -->
    <header class="pl-header">
      <div class="pl-logo">
        <!-- REEMPLAZA "assets/logo.png" POR LA RUTA DE TU IMAGEN -->
        <img src="assets/logo.png" alt="Logo PlayList" class="pl-logo-img">
      </div>
      <h1>PlayList <span class="pl-header-sub">(Proyecto)</span></h1>
    </header>

    <!-- MAIN: 3 paneles -->
    <main class="pl-main">
      
      <!-- Panel Izquierdo: Playlists -->
      <aside class="pl-panel pl-panel--sidebar">
        <div class="pl-panel-header">
          <span>Playlists</span>
          <button class="pl-btn-icon" onclick="app.newPlaylist()" title="Nueva playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="pl-list" id="playlistList"></div>
      </aside>

      <!-- Panel Central: Canciones -->
      <section class="pl-panel pl-panel--main">
        <div class="pl-panel-header">
          <span id="songsHeader">Canciones (PL)</span>
          <button class="pl-btn-icon" onclick="app.addSong()" title="Agregar canción">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="pl-list" id="songList"></div>
      </section>

      <!-- Panel Derecho: Formulario Crear/Editar -->
      <aside class="pl-panel pl-panel--form">
        <div class="pl-panel-header">
          <span id="formHeader">Crear Playlist</span>
        </div>
        <div class="pl-form" id="playlistForm">
          <div class="pl-form-group">
            <label for="plName">Nombre</label>
            <input type="text" id="plName" placeholder="Mi playlist...">
          </div>
          <div class="pl-form-group">
            <label for="plDesc">Descripción</label>
            <textarea id="plDesc" placeholder="Describe tu playlist..."></textarea>
          </div>
          <div class="pl-form-actions">
            <button class="pl-btn-primary" onclick="app.savePlaylist()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Guardar
            </button>
            <button class="pl-btn-secondary" onclick="app.cancelEdit()">Cancelar</button>
          </div>
        </div>
      </aside>

    </main>

    <!-- BARRA DE REPRODUCCIÓN -->
    <footer class="pl-player">
      
      <!-- Carátula / Icono -->
      <div class="pl-player-art" id="playerArt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="2" fill="currentColor" stroke="none"/>
          <circle cx="18" cy="16" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <!-- Info de la canción -->
      <div class="pl-player-info">
        <div class="pl-player-title" id="playerTitle">Selecciona una canción</div>
        <div class="pl-player-artist" id="playerArtist">—</div>
      </div>

      <!-- Barra de progreso -->
      <div class="pl-player-progress">
        <div class="pl-progress-bar" onclick="app.seek(event)">
          <div class="pl-progress-fill" id="progressFill"></div>
        </div>
        <div class="pl-progress-time">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <!-- Controles -->
      <div class="pl-player-controls">
        
        <!-- Shuffle -->
        <button class="pl-control-btn" id="btnShuffle" onclick="app.toggleShuffle()" title="Aleatorio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>

        <!-- Prev -->
        <button class="pl-control-btn" onclick="app.prev()" title="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polygon points="19 20 9 12 19 4 19 20"/>
            <line x1="5" y1="19" x2="5" y2="5"/>
          </svg>
        </button>

        <!-- Play / Pause -->
        <button class="pl-control-btn pl-play" id="btnPlay" onclick="app.togglePlay()">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <!-- Next -->
        <button class="pl-control-btn" onclick="app.next()" title="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
        </button>

        <!-- Repeat -->
        <button class="pl-control-btn" id="btnRepeat" onclick="app.toggleRepeat()" title="Repetir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>

      </div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
